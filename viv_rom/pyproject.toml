[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "viv-rom"
description = "A Python package for reduced order modeling of vortex induced vibrations of wind turbine blades via proper orthogonal decomposition"
version = "0.1.0"
requires-python = ">=3.14"
readme = "README.md"
authors = [
    { name = "Davis Stöwer", email = "s242864@dtu.dk" }
]

dependencies = [
    "numpy>=2.0",   # np.trapezoid
    "scipy>=1.12",  # ShortTimeFFT
	"openpyxl>=3.0",
	"pyyaml>=6.0",   # windIO blade geometry
	"matplotlib>=3.0"
]

license = "MIT"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
viv = "viv_rom.cli:main"
viv-pod = "viv_rom.pod.cli:main"
viv-gpod = "viv_rom.gpod.cli:main"
viv-spectral = "viv_rom.spectral.cli:main"
viv-spod = "viv_rom.spod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]